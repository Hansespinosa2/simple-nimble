system: Nimble
version: v2.0.1
sources:
  core_rules:
    label: Core Rules 2.0.1
    reference: Core Rules, pp. 6-22, 44-60
    path: specs/nimble-docs/CoreRules-2.0.1.md
  heroes:
    label: Heroes 2.0.1
    reference: Heroes, pp. 7-71
    path: specs/nimble-docs/Heroes-2.0.1.md
  gamemasters_guide:
    label: Gamemaster's Guide 2.0
    reference: Gamemaster's Guide, pp. 23, 43
    path: specs/nimble-docs/GamemastersGuide-2.0.md

derived_values:
  base_speed: 6
  default_max_wounds: 6
  base_inventory_slots: 10
  language_formula: "1 + max(INT, 0) + ancestry/background grants"
  armor_unarmored_formula: "DEX"
  initiative_formula: "DEX"
  max_stat: 5
  max_skill: 12
  hp_level_up_formula: "roll Hit Die with advantage"
  hit_dice_formula: "current level"

starting_equipment:
  source_ref: Core Rules 2.0.1, p. 20
  background_gear_status: not_itemized_in_parsed_sources
  background_gear_source_ref: Core Rules 2.0.1, p. 20
  background_gear_source_quote: "equipment listed for their class and background"
  background_gear_note: "The Core Rules include background equipment with class gear, but the parsed source files do not itemize gear by background. Confirm any background package with your GM and add agreed items manually; no grant is assumed."
  gold_per_level: 50
  gold_per_inventory_slot: 500
  gold_scales_with_starting_level: true
  gold_per_level_source_quote: "50 gp to buy their starting equipment; if starting at a higher level, multiply that by the level you are starting at."
  gold_per_inventory_slot_source_ref: Core Rules 2.0.1, p. 21
  gold_per_inventory_slot_source_quote: "500 gp"

starting_gear_inventory:
  source_ref: Core Rules 2.0.1, pp. 21, 33-37
  miscellaneous_item_note: "Starting-kit items without a specific size are counted as one slot; a GM may adjust unusually bulky items."
  items:
    Battleaxe: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    "Rations (meat)": {slots: 1, source_ref: "Heroes 2.0.1, p. 7; Core Rules 2.0.1, p. 21"}
    "Rope (50 ft.)": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "2 Daggers": {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Sling: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 35"}
    "Cheap Hides": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Chalk: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Short Sword": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Javelins: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 35"}
    "Rusty Mail": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Shortbow: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 35"}
    Dagger: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    "Hunting Trap": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Adventurer's Garb": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Staff: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Soap: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Mace: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    "Wooden Buckler": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Manacles: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Sickle: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Shovel: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Bell: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Instrument: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Mirror: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Strange Plant": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Traveling Robes & Sandals": {slots: 1, source_ref: "Heroes 2.0.1, p. 67; Core Rules 2.0.1, p. 21"}

stats:
  strength:
    abbreviation: STR
    skills: [might]
  dexterity:
    abbreviation: DEX
    skills: [finesse, stealth]
  intelligence:
    abbreviation: INT
    skills: [arcana, examination, lore]
  will:
    abbreviation: WIL
    skills: [influence, insight, naturecraft, perception]

skills:
  arcana: intelligence
  examination: intelligence
  finesse: dexterity
  influence: will
  insight: will
  lore: intelligence
  might: strength
  naturecraft: will
  perception: will
  stealth: dexterity

stat_arrays:
  standard: [2, 2, 0, -1]
  balanced: [2, 1, 1, 0]
  min_max: [3, 1, -1, -1]

classes:
  Berserker:
    source_ref: Heroes 2.0.1, pp. 7-11
    key_stats: [strength, dexterity]
    secondary_stats: [intelligence, will]
    hit_die: 1d12
    starting_hp: 20
    save_bonus: strength
    save_penalty: intelligence
    armor_proficiencies: []
    weapon_proficiencies: [strength]
    armor: {formula: dexterity, base: 0, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: [Battleaxe, "Rations (meat)", "Rope (50 ft.)"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Fury Dice
      max_formula: KEY
      die_by_level: {1: d4, 6: d6, 9: d8, 13: d10, 17: d12}
      pools:
        - key: fury_dice
          name: Fury Dice
          max_formula: KEY
          die_by_level: {1: d4, 6: d6, 9: d8, 13: d10, 17: d12}
          initial_current: 0
          reset: Rage ends / encounter
          reset_events: [rage_end, encounter_end]
    subclasses: [Path of the Mountainheart, Path of the Red Mist]

  The Cheat:
    source_ref: Heroes 2.0.1, pp. 13-17
    key_stats: [dexterity, intelligence]
    secondary_stats: [will, strength]
    hit_die: 1d6
    starting_hp: 10
    save_bonus: dexterity
    save_penalty: will
    armor_proficiencies: [leather]
    weapon_proficiencies: [dexterity]
    armor: {formula: dexterity, base: 3, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["2 Daggers", Sling, "Cheap Hides", Chalk]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Ability counters
      formula: "per ability: 1/turn, 1/day, or 1/Safe Rest"
    subclasses: [Tools of the Silent Blade, Tools of the Scoundrel]

  Commander:
    source_ref: Heroes 2.0.1, pp. 19-23
    key_stats: [strength, intelligence]
    secondary_stats: [dexterity, will]
    hit_die: 1d10
    starting_hp: 17
    save_bonus: strength
    save_penalty: dexterity
    armor_proficiencies: [mail, shields]
    weapon_proficiencies: [martial]
    armor: {formula: dexterity, base: 6, dexterity_cap: 2, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Short Sword", Javelins, "Rusty Mail"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Combat Dice
      max_formula: "STR + upgrades"
      die_by_level: {4: d6, 5: d8, 9: d10, 13: d12, 17: d20}
      pools:
        - key: combat_dice
          name: Combat Dice
          max_formula: STR
          start_level: 4
          die_by_level: {4: d6, 5: d8, 9: d10, 13: d12, 17: d20}
          initial_current: 0
          reset: Encounter ends
          reset_events: [encounter_end]
    subclasses: [Champion of the Bulwark, Champion of the Vanguard, Spellblade]

  Hunter:
    source_ref: Heroes 2.0.1, pp. 25-29
    key_stats: [dexterity, will]
    secondary_stats: [strength, intelligence]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: dexterity
    save_penalty: intelligence
    armor_proficiencies: [leather]
    weapon_proficiencies: [dexterity]
    armor: {formula: dexterity, base: 3, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: [Shortbow, "Cheap Hides", Dagger, "Hunting Trap"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Thrill of the Hunt charges
      formula: "gained from quarry triggers; lost when combat ends"
      pools:
        - key: thrill_of_the_hunt
          name: Thrill of the Hunt charges
          start_level: 2
          initial_current: 0
          reset: Encounter ends
          reset_events: [encounter_end]
    subclasses: [Shadowpath, Wild Heart, Beastmaster]

  Mage:
    source_ref: Heroes 2.0.1, pp. 31-35
    key_stats: [intelligence, will]
    secondary_stats: [strength, dexterity]
    hit_die: 1d6
    starting_hp: 10
    save_bonus: intelligence
    save_penalty: strength
    armor_proficiencies: [cloth]
    weapon_proficiencies: [blades, staves, wands]
    armor: {formula: dexterity, base: 2, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Adventurer's Garb", Staff, Soap]
    spell_schools: [Fire, Ice, Lightning]
    spell_tier_unlocks: {1: 0, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 12: 6, 14: 7, 16: 8, 18: 9}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana
      max_formula: "INT * 3 + LVL"
      max_start_level: 2
      pools:
        - key: mana
          name: Mana
          max_formula: "INT * 3 + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Chaos, Control]

  Oathsworn:
    source_ref: Heroes 2.0.1, pp. 37-41
    key_stats: [strength, will]
    secondary_stats: [dexterity, intelligence]
    hit_die: 1d10
    starting_hp: 17
    save_bonus: strength
    save_penalty: dexterity
    armor_proficiencies: [all]
    weapon_proficiencies: [strength]
    armor: {formula: dexterity, base: 6, dexterity_cap: 2, shield_bonus: 2, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: [Mace, "Rusty Mail", "Wooden Buckler", Manacles]
    spell_schools: [Radiant]
    spell_tier_unlocks: {1: -1, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 13: 6, 17: 7}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana and Judgment Dice
      max_formula: "mana WIL + LVL; Lay on Hands 5 * LVL"
      max_start_level: 2
      die_by_level: {1: 2d6, 3: d8, 5: d10, 8: d12, 10: d20}
      pools:
        - key: mana
          name: Mana
          max_formula: "WIL + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
        - key: lay_on_hands
          name: Lay on Hands
          max_formula: "5 * LVL"
          reset: Safe Rest
          reset_events: [safe_rest]
        - key: judgment_dice
          name: Judgment Dice
          max_by_level: {1: 2, 14: 3}
          die_by_level: {1: 2d6, 3: d8, 5: d10, 8: d12, 10: d20}
          initial_current: 0
          reset: When attacked with no dice
    subclasses: [Oath of Vengeance, Oath of Refuge, Oathbreaker]

  Shadowmancer:
    source_ref: Heroes 2.0.1, pp. 43-47
    key_stats: [intelligence, dexterity]
    secondary_stats: [strength, will]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: intelligence
    save_penalty: will
    armor_proficiencies: [cloth]
    weapon_proficiencies: [blades, wands]
    armor: {formula: dexterity, base: 2, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Adventurer's Garb", Sickle, Shovel]
    spell_schools: [Necrotic]
    spell_tier_unlocks: {1: 0, 2: 1, 5: 2, 7: 3, 10: 4, 13: 5, 16: 6, 19: 7}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Pilfered Power uses
      max_formula: "DEX uses before patron retaliation; resets on Safe Rest"
      pools:
        - key: pilfered_power
          name: Pilfered Power
          max_formula: DEX
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Pact of the Red Dragon, Pact of the Abyssal Depths, Reaver]

  Shepherd:
    source_ref: Heroes 2.0.1, pp. 49-53
    key_stats: [will, strength]
    secondary_stats: [intelligence, dexterity]
    hit_die: 1d10
    starting_hp: 17
    save_bonus: will
    save_penalty: dexterity
    armor_proficiencies: [mail, shields]
    weapon_proficiencies: [strength, wands]
    armor: {formula: dexterity, base: 6, dexterity_cap: 2, shield_bonus: 2, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Rusty Mail", Mace, "Wooden Buckler", Bell]
    spell_schools: [Radiant, Necrotic]
    spell_tier_unlocks: {1: 0, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 12: 6, 14: 7, 16: 8, 18: 9}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana
      max_formula: "WIL * 3 + LVL"
      max_start_level: 2
      pools:
        - key: mana
          name: Mana
          max_formula: "WIL * 3 + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Luminary of Mercy, Luminary of Malice]

  Songweaver:
    source_ref: Heroes 2.0.1, pp. 55-59
    key_stats: [will, intelligence]
    secondary_stats: [strength, dexterity]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: will
    save_penalty: strength
    armor_proficiencies: [cloth, leather]
    weapon_proficiencies: [dexterity, wands]
    armor: {formula: dexterity, base: 2, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Adventurer's Garb", Instrument, Dagger, Mirror]
    spell_schools: [Wind, choice]
    spell_tier_unlocks: {1: 0, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 12: 6, 14: 7, 16: 8, 18: 9}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana and Inspiration
      max_formula: "mana INT * 3 + LVL; Inspiration 2 * WIL per Safe Rest"
      max_start_level: 2
      pools:
        - key: mana
          name: Mana
          max_formula: "INT * 3 + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
        - key: inspiration
          name: Inspiration
          max_formula: "2 * WIL"
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Herald of Snark, Herald of Courage]

  Stormshifter:
    source_ref: Heroes 2.0.1, pp. 61-65
    key_stats: [will, dexterity]
    secondary_stats: [strength, intelligence]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: will
    save_penalty: strength
    armor_proficiencies: [cloth]
    weapon_proficiencies: [dexterity]
    armor: {formula: dexterity, base: 3, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Cheap Hides", Staff, "Strange Plant"]
    spell_schools: [Wind, Lightning]
    spell_tier_unlocks: {1: 0, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 12: 6, 14: 7, 16: 8, 18: 9}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana and Beastshift charges
      max_formula: "mana WIL * 3 + LVL; Beastshift DEX charges per Safe Rest"
      max_start_level: 2
      pools:
        - key: mana
          name: Mana
          max_formula: "WIL * 3 + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
        - key: beastshift
          name: Beastshift
          max_formula: DEX
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Circle of Fang & Claw, Circle of Sky & Storm]

  Zephyr:
    source_ref: Heroes 2.0.1, pp. 67-71
    key_stats: [dexterity, strength]
    secondary_stats: [intelligence, will]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: dexterity
    save_penalty: intelligence
    armor_proficiencies: []
    weapon_proficiencies: [melee]
    armor: {formula: dexterity_plus_strength, base: 0, source_ref: "Heroes 2.0.1, p. 67"}
    starting_gear: [Staff, "Traveling Robes & Sandals"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Bursts of Speed
      max_formula: DEX
      pools:
        - key: bursts_of_speed
          name: Bursts of Speed
          max_formula: DEX
          initial_current: 0
          reset: Encounter ends
          reset_events: [encounter_end]
    subclasses: [Way of Flame, Way of Pain]

