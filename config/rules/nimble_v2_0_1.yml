story_subclass_weapon_rules:
  Shadowmancer:
    Reaver:
      Bonescythe:
        base_damage_dice: 2
        additional_die_every_levels: 5
        damage_die: d12
        damage_type: slashing
        bonus_damage_stat: dexterity
        bonus_damage_type: necrotic
        reach: 2
        action_cost: 1
        invocation_carryover_note: "Any Invocations affecting Shadow Blast affect your Bonescythe instead."
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "Action: Summon a magical Bonescythe, a melee weapon: 2d12 slashing+DEX necrotic damage to each die (Reach: 2). It shatters after you hit with it (or when combat ends). Any Invocations affecting Shadow Blast affect your Bonescythe instead. Every 5 levels, add 1 extra damage die."

story_subclass_feature_notes:
  Oathsworn:
    Oathbreaker:
      - name: Dark Benediction
        unlock_level: 1
        effect: Replace access to True Strike, Heal, and Warding Bond with Entice, Shadow Trap, and Dread Visage; Utility Spell choices may be Radiant or Necrotic.
        source_ref: Heroes 2.0.1, p. 73
        source_quote: "gain access"
      - name: Paragon of Power
        unlock_level: 2
        effect: Replaces Paragon of Virtue; gain advantage on Might checks to intimidate.
        source_ref: Heroes 2.0.1, p. 73
        source_quote: "Advantage on Might checks"
      - name: Aura of Suffering
        unlock_level: 3
        effect: Gain Reach 4 and may Interpose for allies in the aura; Radiant Judgment triggers when you could Interpose but choose not to, rather than when attacked.
        source_ref: Heroes 2.0.1, p. 73
      - name: We All Suffer
        unlock_level: 3
        effect: Gain +2 maximum Wounds. When an ally in your aura would gain Wounds or fail a save, you may take the effect instead and trigger Radiant Judgment.
        source_ref: Heroes 2.0.1, p. 73
        source_quote: "Gain +2 max Wounds"
      - name: Bring Me Your Pain
        unlock_level: 3
        effect: Reaction when a willing ally in your aura would drop to 0 HP; exchange current HP, grant the ally Temp HP for any excess over their maximum, and take the Wound instead.
        source_ref: Heroes 2.0.1, p. 73
      - name: Torment
        unlock_level: 7
        effect: Lay on Hands heals you for twice its normal amount and others for half; when dealing damage, spend Lay on Hands points to add the same amount of damage, ignoring armor.
        source_ref: Heroes 2.0.1, p. 73
      - name: Exploit
        unlock_level: 11
        effect: Reaction when an ally in your aura Defends; spend Judgment Dice to force an enemy in your aura to Interpose, except against its own attack.
        source_ref: Heroes 2.0.1, p. 73
      - name: Bloody Terror
        unlock_level: 15
        effect: Attacks against you gain one instance of disadvantage per Wound, up to three.
        source_ref: Heroes 2.0.1, p. 73
        source_quote: "max 3"
  Shadowmancer:
    Reaver:
      - name: Hollow One
        unlock_level: 3
        effect: You can no longer cast Shadow Blast or tiered spells using Pilfered Power; your patron leaves you the Bonescythe.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "Cut off from your patron, you can no longer cast Shadow Blast and you can no longer cast tiered spells using Pilfered Power."
      - name: Shadow Exploit
        unlock_level: 3
        effect: Sacrifice a shadow minion to cast a spell at your highest unlocked tier; each subsequent Shadow Exploit cast this encounter costs one more minion.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "Sacrifice a shadow minion to cast a spell at the highest tier you have unlocked. Each subsequent spell you cast in this encounter costs 1 additional minion."
      - name: Martyr Spawn
        unlock_level: 3
        effect: Whenever you Defend, you may sacrifice a shadow minion to take no damage.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "Whenever you Defend, you can sacrifice a shadow minion to take no damage."
      - name: Grim Harrow
        unlock_level: 7
        effect: When striking with the Bonescythe, divide its damage dice among any number of adjacent targets within Reach.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "When you strike with your Bonescythe, you may divide the dice as you choose amongst any number of adjacent targets within Reach."
      - name: Reap
        unlock_level: 7
        effect: When the Bonescythe crits or kills a creature, summon a shadow minion for free.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "When your Bonescythe crits, or kills a creature, summon a shadow minion for free."
      - name: My Blood, My Power
        unlock_level: 11
        effect: Take 1 Wound to cast a tiered spell you know at the highest tier you have unlocked.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "You may take 1 Wound to cast a tiered spell you know at the highest tier you have unlocked."
      - name: Otherworldly Might
        unlock_level: 11
        effect: Gain advantage on concentration checks while you have any shadow minions.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "Advantage on concentration checks if you have any shadow minions."
      - name: I'm the Patron Now!
        unlock_level: 15
        effect: Summon 2 shadow minions for free when you roll Initiative.
        source_ref: Heroes 2.0.1, p. 78
        source_quote: "Summon 2 shadow minions for free when you roll Initiative."

