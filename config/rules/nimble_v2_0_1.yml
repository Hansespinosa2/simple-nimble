system: Nimble
version: v2.0.1
sources:
  core_rules:
    label: Core Rules 2.0.1
    reference: Core Rules, pp. 6-22, 44-60
    path: specs/nimble-docs/CoreRules-2.0.1.md
  heroes:
    label: Heroes 2.0.1
    reference: Heroes, pp. 7-71
    path: specs/nimble-docs/Heroes-2.0.1.md
  gamemasters_guide:
    label: Gamemaster's Guide 2.0
    reference: Gamemaster's Guide, pp. 23, 43
    path: specs/nimble-docs/GamemastersGuide-2.0.md

derived_values:
  base_speed: 6
  default_max_wounds: 6
  base_inventory_slots: 10
  save_dc_base: 10
  skill_points_at_level_one: 4
  skill_points_per_level: 1
  skill_point_transfers_per_level: 1
  skill_point_source_ref: "Core Rules 2.0.1, p. 20"
  skill_point_source_quote: "At level 1 ... may place 4 additional skill points wherever you like."
  stat_increase_mechanics:
    key: {choice_count: 1, amount: 1, distinct: true, label: "Key Stat"}
    secondary: {choice_count: 1, amount: 1, distinct: true, label: "Secondary Stat"}
    any_two: {choice_count: 2, amount: 1, distinct: true, label: "stat"}
  max_level: 20
  max_level_source_ref: "Heroes 2.0.1, class progressions"
  max_level_source_quote: "Each published class progression ends at level 20."
  max_stat_source_ref: "Core Rules 2.0.1, p. 6"
  max_stat_source_quote: "The maximum a hero’s stat can typically go is +5."
  max_skill_source_ref: "Core Rules 2.0.1, p. 8"
  max_skill_source_quote: "Roll 1d20 and add your skill (the max bonus a skill can ever have is +12)."
  armor_unarmored_formula: "DEX"
  initiative_formula: "DEX"
  max_stat: 5
  max_skill: 12
  hp_level_up_formula: "roll Hit Die with advantage"
  hit_dice_formula: "current level"

languages:
  source_ref: "Core Rules 2.0.1, pp. 20, 23-26"
  default_language: Common
  source_quote: "All heroes speak Common by default. Each point of INT grants you an additional language known."
  languages:
    - Common
    - Dwarvish
    - Elvish
    - Goblin
    - Infernal
    - "Thieves' Cant"
    - Celestial
    - Draconic
    - Primordial
    - Deep Speak
  intelligence_choices_per_point: 1
  ancestry_grant_minimum_intelligence: 0
  ancestry_grant_source_quote: "You know Dwarvish if your INT is not negative."
  origin_grant_source_ref: "Rules canon, §11 Languages"
  selection_note: "Each positive INT point requires a player-chosen language; do not assign one automatically. Origin grants are additional to INT choices."
  class_grants:
    The Cheat:
      - level: 3
        languages: ["Thieves' Cant"]
        source_ref: "Heroes 2.0.1, p. 14"
        source_quote: "Thieves' Cant. You learn the secret language of rogues and scoundrels."
  feature_language_choices:
    Devoted Acolyte:
      count: 2
      options: [Celestial, Draconic, "Deep Speak", Infernal, Primordial]
      source_ref: "Heroes 2.0.1, p. 46"
      source_quote: "Learn 2 of the following languages: Celestial, Draconic, Deep Speak, Infernal, or Primordial."

condition_tracking:
  source_ref: "Core Rules 2.0.1, p. 11"
  manual_conditions:
    - Blinded
    - Charmed
    - Dazed
    - Frightened
    - Grappled
    - Hampered
    - Incapacitated
    - Invisible
    - Petrified
    - Poisoned
    - Prone
    - Restrained
    - Riding
    - Slowed
    - Taunted
  derived_conditions:
    - name: Bloodied
      predicate: at_or_below_half_hit_points
      source_quote: "At half HP or less."
    - name: Dying
      predicate: zero_hit_points
      source_quote: "At 0 HP."
    - name: Wounded
      predicate: any_wounds
      source_quote: "Has any Wounds."
  minor_status_examples:
    - Charged
    - Distracted
    - Smoldering
  tracker_note: "HP- and Wound-derived states are displayed automatically. Other conditions and minor statuses are recorded as notes; the tracker does not apply their effects or durations."

starting_equipment:
  source_ref: Core Rules 2.0.1, p. 20
  background_gear_status: not_itemized_in_parsed_sources
  background_gear_source_ref: Core Rules 2.0.1, p. 20
  background_gear_source_quote: "equipment listed for their class and background"
  background_gear_note: "The Core Rules include background equipment with class gear, but the parsed source files do not itemize gear by background. Confirm any background package with your GM and add agreed items manually; no grant is assumed."
  gold_per_level: 50
  gold_per_inventory_slot: 500
  gold_scales_with_starting_level: true
  gold_per_level_source_quote: "50 gp to buy their starting equipment; if starting at a higher level, multiply that by the level you are starting at."
  gold_per_inventory_slot_source_ref: Core Rules 2.0.1, p. 21
  gold_per_inventory_slot_source_quote: "500 gp"

starting_gear_inventory:
  source_ref: Core Rules 2.0.1, pp. 21, 33-37
  miscellaneous_item_note: "Starting-kit items without a specific size are counted as one slot; a GM may adjust unusually bulky items."
  items:
    Battleaxe: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    "Rations (meat)": {slots: 1, source_ref: "Heroes 2.0.1, p. 7; Core Rules 2.0.1, p. 21"}
    "Rope (50 ft.)": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "2 Daggers": {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Sling: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 35"}
    "Cheap Hides": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Chalk: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Short Sword": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Javelins: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 35"}
    "Rusty Mail": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Shortbow: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 35"}
    Dagger: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    "Hunting Trap": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Adventurer's Garb": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Staff: {slots: 2, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Soap: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Mace: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    "Wooden Buckler": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 33"}
    Manacles: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Sickle: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 34"}
    Shovel: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Bell: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Instrument: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    Mirror: {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Strange Plant": {slots: 1, source_ref: "Core Rules 2.0.1, pp. 21, 37"}
    "Traveling Robes & Sandals": {slots: 1, source_ref: "Heroes 2.0.1, p. 67; Core Rules 2.0.1, p. 21"}

equipment_armor:
  source_ref: Core Rules 2.0.1, p. 33
  slots_source_ref: Core Rules 2.0.1, p. 21
  items:
    "Adventurer's Garb": {kind: armor, proficiency: cloth, armor_value: 2, formula: dexterity, slots_worn: 1, slots_unworn: 2, cost_gp: 10, source_ref: "Core Rules 2.0.1, p. 33"}
    "Minor Enchantment": {kind: armor, proficiency: cloth, armor_value: 3, formula: dexterity, slots_worn: 1, slots_unworn: 2, cost_gp: 100, source_ref: "Core Rules 2.0.1, p. 33"}
    "Major Enchantment": {kind: armor, proficiency: cloth, armor_value: 4, formula: dexterity, slots_worn: 1, slots_unworn: 2, cost_gp: 1000, source_ref: "Core Rules 2.0.1, p. 33"}
    "Epic Enchantment": {kind: armor, proficiency: cloth, armor_value: 5, formula: dexterity, slots_worn: 1, slots_unworn: 2, cost_gp: 10000, source_ref: "Core Rules 2.0.1, p. 33"}
    "Cheap Hides": {kind: armor, proficiency: leather, armor_value: 3, formula: dexterity, slots_worn: 1, slots_unworn: 2, cost_gp: 5, source_ref: "Core Rules 2.0.1, p. 33"}
    "Ox Hide": {kind: armor, proficiency: leather, armor_value: 4, formula: dexterity, slots_worn: 1, slots_unworn: 2, cost_gp: 45, source_ref: "Core Rules 2.0.1, p. 33"}
    "Hard Leather": {kind: armor, proficiency: leather, armor_value: 5, formula: dexterity, slots_worn: 1, slots_unworn: 2, strength_requirement: 1, cost_gp: 300, source_ref: "Core Rules 2.0.1, p. 33"}
    Wyrmhide: {kind: armor, proficiency: leather, armor_value: 6, formula: dexterity, slots_worn: 1, slots_unworn: 2, strength_requirement: 1, cost_gp: 2000, source_ref: "Core Rules 2.0.1, p. 33"}
    "Rusty Mail": {kind: armor, proficiency: mail, armor_value: 6, formula: dexterity, dexterity_cap: 2, slots_worn: 1, slots_unworn: 2, cost_gp: 15, source_ref: "Core Rules 2.0.1, p. 33"}
    "Chain Shirt": {kind: armor, proficiency: mail, armor_value: 9, formula: dexterity, dexterity_cap: 2, slots_worn: 1, slots_unworn: 2, strength_requirement: 2, cost_gp: 60, source_ref: "Core Rules 2.0.1, p. 33"}
    "Scale Mail": {kind: armor, proficiency: mail, armor_value: 12, formula: dexterity, dexterity_cap: 2, slots_worn: 1, slots_unworn: 2, strength_requirement: 3, cost_gp: 700, source_ref: "Core Rules 2.0.1, p. 33"}
    Dragonscale: {kind: armor, proficiency: mail, armor_value: 15, formula: dexterity, dexterity_cap: 2, slots_worn: 1, slots_unworn: 2, strength_requirement: 4, cost_gp: 3000, source_ref: "Core Rules 2.0.1, p. 33"}
    "Rusty Plate": {kind: armor, proficiency: plate, armor_value: 10, formula: flat, slots_worn: 1, slots_unworn: 2, strength_requirement: 2, cost_gp: 25, source_ref: "Core Rules 2.0.1, p. 33"}
    "Half Plate": {kind: armor, proficiency: plate, armor_value: 14, formula: flat, slots_worn: 1, slots_unworn: 2, strength_requirement: 3, cost_gp: 200, source_ref: "Core Rules 2.0.1, p. 33"}
    "Full Plate": {kind: armor, proficiency: plate, armor_value: 18, formula: flat, slots_worn: 1, slots_unworn: 2, strength_requirement: 4, cost_gp: 2000, source_ref: "Core Rules 2.0.1, p. 33"}
    "Mithril Plate": {kind: armor, proficiency: plate, armor_value: 22, formula: flat, slots_worn: 1, slots_unworn: 2, strength_requirement: 5, cost_gp: 5000, source_ref: "Core Rules 2.0.1, p. 33"}
    "Wooden Buckler": {kind: shield, proficiency: shields, armor_value: 2, formula: flat, slots_worn: 1, slots_unworn: 1, cost_gp: 5, source_ref: "Core Rules 2.0.1, p. 33"}
    "Iron Shield": {kind: shield, proficiency: shields, armor_value: 4, formula: flat, slots_worn: 1, slots_unworn: 1, strength_requirement: 2, cost_gp: 80, source_ref: "Core Rules 2.0.1, p. 33"}
    "Tower Shield": {kind: shield, proficiency: shields, armor_value: 6, formula: flat, slots_worn: 1, slots_unworn: 1, strength_requirement: 3, cost_gp: 1500, source_ref: "Core Rules 2.0.1, p. 33"}
    "Dragon Shield": {kind: shield, proficiency: shields, armor_value: 8, formula: flat, slots_worn: 1, slots_unworn: 1, strength_requirement: 3, cost_gp: 9000, source_ref: "Core Rules 2.0.1, p. 33"}

stats:
  strength:
    abbreviation: STR
    skills: [might]
  dexterity:
    abbreviation: DEX
    skills: [finesse, stealth]
  intelligence:
    abbreviation: INT
    skills: [arcana, examination, lore]
  will:
    abbreviation: WIL
    skills: [influence, insight, naturecraft, perception]

skills:
  arcana: intelligence
  examination: intelligence
  finesse: dexterity
  influence: will
  insight: will
  lore: intelligence
  might: strength
  naturecraft: will
  perception: will
  stealth: dexterity

stat_arrays:
  standard: [2, 2, 0, -1]
  balanced: [2, 1, 1, 0]
  min_max: [3, 1, -1, -1]

classes:
  Berserker:
    source_ref: Heroes 2.0.1, pp. 7-11
    key_stats: [strength, dexterity]
    secondary_stats: [intelligence, will]
    hit_die: 1d12
    starting_hp: 20
    save_bonus: strength
    save_penalty: intelligence
    armor_proficiencies: []
    weapon_proficiencies: [strength]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: [Battleaxe, "Rations (meat)", "Rope (50 ft.)"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Fury Dice
      max_formula: KEY
      die_by_level: {1: d4, 6: d6, 9: d8, 13: d10, 17: d12}
      pools:
        - key: fury_dice
          name: Fury Dice
          max_formula: KEY
          die_by_level: {1: d4, 6: d6, 9: d8, 13: d10, 17: d12}
          initial_current: 0
          reset: Rage ends / encounter
          reset_events: [rage_end, encounter_end]
    subclasses: [Path of the Mountainheart, Path of the Red Mist]

  The Cheat:
    source_ref: Heroes 2.0.1, pp. 13-17
    key_stats: [dexterity, intelligence]
    secondary_stats: [will, strength]
    hit_die: 1d6
    starting_hp: 10
    save_bonus: dexterity
    save_penalty: will
    armor_proficiencies: [leather]
    weapon_proficiencies: [dexterity]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["2 Daggers", Sling, "Cheap Hides", Chalk]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Ability counters
      formula: "per ability: 1/turn, 1/day, or 1/Safe Rest"
    subclasses: [Tools of the Silent Blade, Tools of the Scoundrel]

  Commander:
    source_ref: Heroes 2.0.1, pp. 19-23
    key_stats: [strength, intelligence]
    secondary_stats: [dexterity, will]
    hit_die: 1d10
    starting_hp: 17
    save_bonus: strength
    save_penalty: dexterity
    armor_proficiencies: [mail, shields]
    weapon_proficiencies: [martial]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Short Sword", Javelins, "Rusty Mail"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Combat Dice
      max_formula: "STR + upgrades"
      die_by_level: {4: d6, 5: d8, 9: d10, 13: d12, 17: d20}
      pools:
        - key: combat_dice
          name: Combat Dice
          max_formula: STR
          start_level: 4
          die_by_level: {4: d6, 5: d8, 9: d10, 13: d12, 17: d20}
          initial_current: 0
          reset: Encounter ends
          reset_events: [encounter_end]
    subclasses: [Champion of the Bulwark, Champion of the Vanguard]
    story_based_subclasses:
      - name: Spellblade
        source_ref: "Heroes 2.0.1, p. 73"
        source_quote: "At your GM's discretion, these can be chosen at any point in a campaign when a story demands it, replacing your existing subclass."

  Hunter:
    source_ref: Heroes 2.0.1, pp. 25-29
    key_stats: [dexterity, will]
    secondary_stats: [strength, intelligence]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: dexterity
    save_penalty: intelligence
    armor_proficiencies: [leather]
    weapon_proficiencies: [dexterity]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: [Shortbow, "Cheap Hides", Dagger, "Hunting Trap"]
    spell_schools: []
    spell_tier_unlocks: {}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Thrill of the Hunt charges
      formula: "gained from quarry triggers; lost when combat ends"
      pools:
        - key: thrill_of_the_hunt
          name: Thrill of the Hunt charges
          start_level: 2
          initial_current: 0
          reset: Encounter ends
          reset_events: [encounter_end]
    subclasses: [Shadowpath, Wild Heart]
    story_based_subclasses:
      - name: Beastmaster
        source_ref: "Heroes 2.0.1, p. 73"
        source_quote: "At your GM's discretion, these can be chosen at any point in a campaign when a story demands it, replacing your existing subclass."

  Mage:
    source_ref: Heroes 2.0.1, pp. 31-35
    key_stats: [intelligence, will]
    secondary_stats: [strength, dexterity]
    hit_die: 1d6
    starting_hp: 10
    save_bonus: intelligence
    save_penalty: strength
    armor_proficiencies: [cloth]
    weapon_proficiencies: [blades, staves, wands]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Adventurer's Garb", Staff, Soap]
    spell_schools: [Fire, Ice, Lightning]
    spell_tier_unlocks: {1: 0, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 12: 6, 14: 7, 16: 8, 18: 9}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana
      max_formula: "INT * 3 + LVL"
      max_start_level: 2
      pools:
        - key: mana
          name: Mana
          max_formula: "INT * 3 + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Chaos, Control]

  Oathsworn:
    source_ref: Heroes 2.0.1, pp. 37-41
    key_stats: [strength, will]
    secondary_stats: [dexterity, intelligence]
    hit_die: 1d10
    starting_hp: 17
    save_bonus: strength
    save_penalty: dexterity
    armor_proficiencies: [all]
    weapon_proficiencies: [strength]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: [Mace, "Rusty Mail", "Wooden Buckler", Manacles]
    spell_schools: [Radiant]
    spell_tier_unlocks: {1: -1, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 13: 6, 17: 7}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana and Judgment Dice
      max_formula: "mana WIL + LVL; Lay on Hands 5 * LVL"
      max_start_level: 2
      die_by_level: {1: 2d6, 3: d8, 5: d10, 8: d12, 10: d20}
      pools:
        - key: mana
          name: Mana
          max_formula: "WIL + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
        - key: lay_on_hands
          name: Lay on Hands
          max_formula: "5 * LVL"
          reset: Safe Rest
          reset_events: [safe_rest]
        - key: judgment_dice
          name: Judgment Dice
          max_by_level: {1: 2, 14: 3}
          die_by_level: {1: 2d6, 3: d8, 5: d10, 8: d12, 10: d20}
          initial_current: 0
          reset: When attacked with no dice
    subclasses: [Oath of Vengeance, Oath of Refuge]
    story_based_subclasses:
      - name: Oathbreaker
        source_ref: "Heroes 2.0.1, p. 73"
        source_quote: "At your GM's discretion, these can be chosen at any point in a campaign when a story demands it, replacing your existing subclass."

  Shadowmancer:
    source_ref: Heroes 2.0.1, pp. 43-47
    key_stats: [intelligence, dexterity]
    secondary_stats: [strength, will]
    hit_die: 1d8
    starting_hp: 13
    save_bonus: intelligence
    save_penalty: will
    armor_proficiencies: [cloth]
    weapon_proficiencies: [blades, wands]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Adventurer's Garb", Sickle, Shovel]
    spell_schools: [Necrotic]
    spell_tier_unlocks: {1: 0, 2: 1, 5: 2, 7: 3, 10: 4, 13: 5, 16: 6, 19: 7}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Pilfered Power and Shadow Minions
      max_formula: "Pilfered Power: DEX uses before patron retaliation; Shadow Minions: min(INT, LVL)"
      pools:
        - key: pilfered_power
          name: Pilfered Power
          max_formula: DEX
          reset: Safe Rest
          reset_events: [safe_rest]
          source_ref: Heroes 2.0.1, p. 44
          source_quote: "You can do this DEX times before your patron takes notice."
        - key: shadow_minions
          name: Shadow Minions
          max_formula: "MIN(INT, LVL)"
          minimum_max: 0
          initial_current: 0
          reset: Encounter ends
          reset_events: [encounter_end]
          source_ref: Heroes 2.0.1, p. 43
          source_quote: "You can summon a max of INT or LVL minions this way, whichever is lower. They abandon you immediately outside of combat."
    subclasses: [Pact of the Red Dragon, Pact of the Abyssal Depths]
    story_based_subclasses:
      - name: Reaver
        source_ref: "Heroes 2.0.1, p. 73"
        source_quote: "At your GM's discretion, these can be chosen at any point in a campaign when a story demands it, replacing your existing subclass."

  Shepherd:
    source_ref: Heroes 2.0.1, pp. 49-53
    key_stats: [will, strength]
    secondary_stats: [intelligence, dexterity]
    hit_die: 1d10
    starting_hp: 17
    save_bonus: will
    save_penalty: dexterity
    armor_proficiencies: [mail, shields]
    weapon_proficiencies: [strength, wands]
    armor: {unarmored_formula: dexterity, source_ref: "Core Rules 2.0.1, p. 33"}
    starting_gear: ["Rusty Mail", Mace, "Wooden Buckler", Bell]
    spell_schools: [Radiant, Necrotic]
    spell_tier_unlocks: {1: 0, 2: 1, 4: 2, 6: 3, 8: 4, 10: 5, 12: 6, 14: 7, 16: 8, 18: 9}
    stat_increases:
      key: [4, 8, 12, 16]
      secondary: [5, 9, 13, 17]
      any_two: [20]
    resource:
      name: Mana
      max_formula: "WIL * 3 + LVL"
      max_start_level: 2
      pools:
        - key: mana
          name: Mana
          max_formula: "WIL * 3 + LVL"
          start_level: 2
          reset: Safe Rest
          reset_events: [safe_rest]
    subclasses: [Luminary of Mercy, Luminary of Malice]

  Songweaver:
    source_ref: Heroes 2.0.1, pp. 55-59
