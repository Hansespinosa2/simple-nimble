# PostgreSQL connection settings. Override these with environment variables
# when connecting to a shared or remotely hosted database.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: simple_nimble_development

test:
  <<: *default
  database: simple_nimble_test


# Production uses separate databases for the app, cache, jobs, and Action Cable.
production:
  primary:
    <<: *default
    database: simple_nimble_production
  cache:
    <<: *default
    database: simple_nimble_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: simple_nimble_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: simple_nimble_production_cable
    migrations_paths: db/cable_migrate
